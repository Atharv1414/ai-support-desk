[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-desk"
version = "1.0.0"
description = "AI-native support desk: a fine-tuned small model, retrieval with citations, and an agent with guardrails"
license = { text = "MIT" }
authors = [{ name = "Atharv Patil" }]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2", "pymysql>=1.1",
                "cryptography>=42", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4",
                "anthropic>=1", "pydantic>=2.7"]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.46", "safetensors>=0.4"]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
desk-train = "desk.ml.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]
